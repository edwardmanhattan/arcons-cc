[package]
name = "arcons-cc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Arcons Command Center — the live maritime picture on a wall"
# Proprietary, and deliberately without a `license` field or a root `LICENSE`: see README.

[dependencies]
# UI. Pinned by rev, because `dev` moves: bump it in a commit that says which rev and why.
# `rune` on crates.io is the scripting language, not this one — the git dependency wins, but
# never drop the `git =` key or the wrong crate resolves.
rune = { git = "https://github.com/anomalyco/rune", rev = "46cfcd64cf348ea9391c5db01f0d488c548d74d9" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "46cfcd64cf348ea9391c5db01f0d488c548d74d9" }

# The map engine. Its default build clones ~2 GB of C++ and builds it, so the `map` feature is off in
# the gate: `scripts/verify.sh` must run with no network and no C++ toolchain. `cargo test map::`
# covers the projection and the camera with the feature off; `cargo test --features map map::` and
# `--probe-map` are the map-engine paths, and `MLN_PRECOMPILE=1` builds them from upstream's ~378 MB
# prebuilt amalgam instead of from source. Vendored: see vendor/README.md.
maplibre_native = { path = "vendor/maplibre_native", optional = true }
# The offline seed is a SQLite cache whose expiry rows must be pinned before MapLibre opens it, or a
# fresh install tries to revalidate the style over the network and never reports style-loaded.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# `--probe-map` writes one frame to a PNG for CI, with no window; `--assert` reads captures
# back. Not behind the map feature: the assertion has to run where the map engine is not built.
png = "0.18"

# The socket client. Vendored (see `vendor/README.md`): upstream 0.2.6 cannot set the connect
# command's `data`, which is where Minos reads our token, and drops handshake refusal codes.
# TLS: rustls against the SYSTEM trust store, not a bundled one. The socket is `wss://` behind the
# same certificate as the API, and a wall inside a deployment may trust a private CA that only the
# system store knows about; a bundled root list would work in development and fail on the wall.
tokio-centrifuge = { version = "=0.2.6", default-features = false, features = ["rustls-tls-native-roots"] }

# Build one thread per concern, never a blocking call from the UI thread.
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "webpki-roots"], default-features = false }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }

# `config.toml` and `credentials.toml`. The format is the operator's, not ours: TOML is what a
# sysadmin already knows how to write and check, and `deny_unknown_fields` turns a typo into a
# refused start rather than a silently defaulted ocean.
toml = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[features]
default = []
# #5: the map thread, the offline tile seed, and the vendored `maplibre_native`.
map = ["dep:maplibre_native", "dep:rusqlite"]

[patch.crates-io]
tokio-centrifuge = { path = "vendor/tokio-centrifuge" }
