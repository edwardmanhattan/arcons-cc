[package]
name = "arcons-cc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Arcons Command Center — the live maritime picture on a wall"
# Proprietary, and deliberately without a `license` field or a root `LICENSE`: see README.

[dependencies]
# UI. Pinned by rev, because `dev` moves: bump it in a commit that says which rev and why.
# `rune` on crates.io is the scripting language, not this one — the git dependency wins, but
# never drop the `git =` key or the wrong crate resolves.
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }

# The map engine. Optional until #5 lands the renderer thread: `maplibre_native`'s build script
# clones ~2 GB of C++ and builds it, so enabling it here would cost every `cargo test` a network
# fetch and a C++ toolchain. The pin is recorded now; #5 turns the feature on and vendors it.
maplibre_native = { version = "0.9", optional = true }

# The socket client. Vendored (see `vendor/README.md`): upstream 0.2.6 cannot set the connect
# command's `data`, which is where Minos reads our token, and drops handshake refusal codes.
tokio-centrifuge = { version = "=0.2.6", default-features = false }

# Build one thread per concern, never a blocking call from the UI thread.
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "webpki-roots"], default-features = false }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# #5 owns this: the map thread, the offline tile seed, and the vendored `maplibre_native`.
map = ["dep:maplibre_native"]

[patch.crates-io]
tokio-centrifuge = { path = "vendor/tokio-centrifuge" }
