[workspace]
# ADR-0009, decision 1: one workspace, two binaries. `cargo run` in this directory still builds the wall
# (the root package is the current package); `cargo run -p desk` builds the desk. Both are in the gate.
members = [".", "crates/desk"]
default-members = [".", "crates/desk"]
resolver = "3"

[workspace.dependencies]
# The Rune pin lives here, once, and both binaries inherit it. A bump is still one commit that names the
# old and the new rev (doc_claims checks this file and ADR-0001 together).
rune = { git = "https://github.com/anomalyco/rune", rev = "1f1d68c4f07f9f814e86b065cffe685f9a694606" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1f1d68c4f07f9f814e86b065cffe685f9a694606" }

[package]
name = "arcons-cc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Arcons Command Center — the live maritime picture on a wall"
# Proprietary, and deliberately without a `license` field or a root `LICENSE`: see README.

[dependencies]
# UI. Pinned by rev, because `dev` moves: bump it in a commit that says which rev and why. The pin itself
# is in `[workspace.dependencies]`, shared with `crates/desk`.
# `rune` on crates.io is the scripting language, not this one — the git dependency wins, but
# never drop the `git =` key or the wrong crate resolves.
rune = { workspace = true }
rune-kit = { workspace = true }

# The map engine. Its default build clones ~2 GB of C++ and builds it, so the `map` feature is off in
# the gate: `scripts/verify.sh` must run with no network and no C++ toolchain. `cargo test map::`
# covers the projection and the camera with the feature off; `cargo test --features map map::` and
# `--probe-map` are the map-engine paths, and `MLN_PRECOMPILE=1` builds them from upstream's ~378 MB
# prebuilt amalgam instead of from source. Vendored: see vendor/README.md.
maplibre_native = { path = "vendor/maplibre_native", optional = true }
# The offline seed is a SQLite cache whose expiry rows must be pinned before MapLibre opens it, or a
# fresh install tries to revalidate the style over the network and never reports style-loaded.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# `--probe-map` writes one frame to a PNG for CI, with no window; `--assert` reads captures
# back. Not behind the map feature: the assertion has to run where the map engine is not built.
png = "0.18"

# Pairing (#194): a device key is 32 fresh bytes, and `devices.toml` keeps only its SHA-256. Both crates
# are the small, pure-Rust implementations — `getrandom` asks the OS for the bytes, `sha2` hashes them —
# rather than a hand-written hash or a clock used as a source of chance.
sha2 = "0.10"
getrandom = "0.3"

# The socket client. Vendored (see `vendor/README.md`): upstream 0.2.6 cannot set the connect
# command's `data`, which is where Minos reads our token, and drops handshake refusal codes.
# TLS: rustls against the SYSTEM trust store, not a bundled one. The socket is `wss://` behind the
# same certificate as the API, and a wall inside a deployment may trust a private CA that only the
# system store knows about; a bundled root list would work in development and fail on the wall.
tokio-centrifuge = { version = "=0.2.6", default-features = false, features = ["rustls-tls-native-roots"] }

# Build one thread per concern, never a blocking call from the UI thread.
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "webpki-roots"], default-features = false }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }

# `config.toml` and `credentials.toml`. The format is the operator's, not ours: TOML is what a
# sysadmin already knows how to write and check, and `deny_unknown_fields` turns a typo into a
# refused start rather than a silently defaulted ocean.
toml = "0.8"

serde = { version = "1", features = ["derive"] }
# `raw_value` keeps a recorded answer's bytes: a corpus line is compared **verbatim**, and a `Value`
# round trip can move a float by one unit in the last place (#224).
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
qrcodegen = "1.8"

[features]
default = []
# #5: the map thread, the offline tile seed, and the vendored `maplibre_native`.
map = ["dep:maplibre_native", "dep:rusqlite"]

[patch.crates-io]
# Every crate Rune patches in *its* workspace, because a consumer does not inherit a dependency's patch: cargo
# applies patches from the workspace root alone. Rune's own list at the pinned rev is the authority —
# `scripts/vendor-patches.sh` reads it and copies each one here, so a bump cannot copy three and leave three
# behind (#247). `vendor/README.md` says, per crate, what upstream's patch does, why we carry it, and when to
# drop it. Linux and macOS build three of them; the rest are the `check`/`map` jobs' on other targets.
winit = { path = "vendor/winit" }
wgpu-hal = { path = "vendor/wgpu-hal" }
sctk-adwaita = { path = "vendor/sctk-adwaita" }
parley_engine = { path = "vendor/parley_engine" }
accesskit_windows = { path = "vendor/accesskit_windows" }
accesskit_macos = { path = "vendor/accesskit_macos" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
naga = { path = "vendor/naga" }
# Ours, not Rune's: Minos reads the token from the connect frame's `data` (#4).
tokio-centrifuge = { path = "vendor/tokio-centrifuge" }
