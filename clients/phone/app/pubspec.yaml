name: arcons_phone_app
description: >-
  The phone's screen: the wall's arrangement as a diagram you can press. ADR-0008, epic #217.
publish_to: none
version: 0.0.1
environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  # The wire, the tiling arithmetic and the client's rules. One copy, tested without a screen (#248, #249, #250).
  arcons_phone:
    path: ../
  material_ui: ^1.11.1
  # The pairing QR's camera and decoder (#271), behind `lib/scanner.dart`'s seam. BSD-3-Clause, and the only package
  # that touches a camera: CameraX + the bundled ML Kit barcode model on Android, AVFoundation/Vision on iOS.
  mobile_scanner: ^7.5.0
  # The relay field's memory (#271): a URL is a setting, not a secret, so it is not in the KeyStore.
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  # The glyphs are the framework's own catalogue (`mobile-ui.md`), which is what this flag makes available.
  uses-material-design: true
