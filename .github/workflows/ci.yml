name: verify

# One step decides whether this is green: scripts/verify.sh — the same command a human or an
# agent runs. Never its individual parts here: CI and a developer must not be able to diverge.
on:
  push:
  pull_request:
  # The Windows-core probe below downloads 1.3 GB, so it does not run on every push: dispatch this
  # workflow when you want its answer (#46).
  workflow_dispatch:

jobs:
  # #31: the crate must build where it might be packaged, and a platform that breaks must be a red job
  # rather than a discovery. `cargo check --all-targets` compiles the tests too, so a `cfg(unix)` test
  # that only exists on Linux is caught on Windows. No `--features map`: the map engine is its own job
  # below, because only two platforms have a precompiled core at all.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}

      - name: cargo check, no map engine
        run: cargo check --all-targets --locked

      # The gate is `scripts/verify.sh`, which is bash and belongs to Linux. What the other platforms
      # can prove cheaply is that the rules still hold: formatting everywhere, and clippy's lints where
      # a `cfg` difference would show up. No goldens: they are rendered by a rasteriser, not a compiler.
      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # #31: `--features map` on the two platforms that have a precompiled core. Allowed to fail, with the
  # log in the job summary, because a broken map on macOS is a finding to record in
  # docs/research/portability.md — not a reason no one can land a card fix. When this passes two runs in
  # a row, delete `continue-on-error` and make it real.
  map:
    name: map (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: map-${{ matrix.os }}

      - name: cmake, for the C++ cores that build from source
        run: cmake --version

      # #60: the Metal core is 378 MB from GitHub's release CDN, and on 2026-11-09 that CDN answered 504
      # three times in a row — which made this *report* flicker for a reason that has nothing to do with the
      # crate. So the asset is fetched once per pinned revision and cached by revision, and the build script
      # is handed the local copy (`MLN_CORE_LIBRARY_PATH`), which it already supports: no download inside
      # `cargo`, no CDN on the critical path, and a warm run skips both.
      - name: the Metal core, by revision
        id: core
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/arcons-cc/mln
          key: mln-core-core-a33d3f00fb9dbf9117ce18edd799aa0ca5bcce5b-macos-arm64-metal-v1

      - name: fetch the Metal core when the cache is cold
        if: runner.os == 'macOS' && steps.core.outputs.cache-hit != 'true'
        shell: bash
        env:
          REV: core-a33d3f00fb9dbf9117ce18edd799aa0ca5bcce5b
        run: |
          set -euo pipefail
          dir="$HOME/.cache/arcons-cc/mln"
          mkdir -p "$dir"
          base="https://github.com/maplibre/maplibre-native/releases/download/$REV"
          # A 504 is the CDN having a bad minute, not a missing asset: retry before failing.
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$dir/core.a" "$base/libmaplibre-native-core-amalgam-macos-arm64-metal.a"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$dir/headers.tar.gz" "$base/maplibre-native-headers.tar.gz"
          ls -l "$dir"

      # The same check `VERIFY_WITH_MAP=1 scripts/verify.sh` runs, at the same standard: `cargo check`
      # tolerates warnings, and code nothing compiles is exactly where a warning is rot already (#152).
      - name: cargo clippy, map engine
        id: map
        run: |
          set -o pipefail
          if [ -f "$HOME/.cache/arcons-cc/mln/core.a" ]; then
            export MLN_CORE_LIBRARY_PATH="$HOME/.cache/arcons-cc/mln/core.a"
            export MLN_CORE_LIBRARY_HEADERS_PATH="$HOME/.cache/arcons-cc/mln/headers.tar.gz"
            echo "using the cached core at $MLN_CORE_LIBRARY_PATH"
          fi
          cargo clippy --features map --all-targets --locked -- -D warnings 2>&1 | tee map.log
        shell: bash
        env:
          # The precompiled core, when the platform has one: 378 MB of download beats an hour of C++. On
          # Windows this still panics with the documented `unsupported target` (#46), which is the point of
          # the job.
          MLN_PRECOMPILE: "1"

      # #46: upstream *does* publish Windows cores for the pinned revision —
      # `maplibre-native-core-windows-x64-{egl,opengl,vulkan}.lib` — they are just not what the build
      # script looks for. This step hands it one through the local-path route it already supports, so the
      # next blocker is the one the log shows rather than the one we guessed at.
      - name: the Windows core, and what it would still need
        id: win
        if: always() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REV: core-a33d3f00fb9dbf9117ce18edd799aa0ca5bcce5b
          # Without this the build script takes the from-source route and never looks at the local path.
          MLN_PRECOMPILE: "1"
        run: |
          set -o pipefail
          base="https://github.com/maplibre/maplibre-native/releases/download/$REV"
          dir="$RUNNER_TEMP/mln"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/core.lib" "$base/maplibre-native-core-windows-x64-vulkan.lib"
          curl -fsSL -o "$dir/headers.tar.gz" "$base/maplibre-native-headers.tar.gz"
          ls -l "$dir"
          MLN_CORE_LIBRARY_PATH="$dir/core.lib" \
          MLN_CORE_LIBRARY_HEADERS_PATH="$dir/headers.tar.gz" \
          cargo build --features map --bin arcons-cc --locked 2>&1 | tee win-core.log || true
          {
            echo "### Windows core handed to the build script: $(grep -cE '^error' win-core.log) error lines"
            echo '```'
            grep -E 'error|panicked|MapLibre Windows|warning: Local library' win-core.log | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: what the map engine said
        if: always()
        shell: bash
        run: |
          {
            echo "### map engine on ${{ matrix.os }}: ${{ steps.map.outcome }}"
            echo '```'
            grep -E 'error|unsupported|panicked|warning: maplibre' map.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # System libraries Rune links against, and software Vulkan (lavapipe) so a headless render
      # cannot pass by finding a GPU the wall does not have. Rune links libxkbcommon and loads
      # Vulkan at run time even when it only snapshots.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libvulkan1 mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@v2

      - name: the gate
        run: scripts/verify.sh
        # No `ARCONS_GOLDENS=off`: CI compares the goldens within the tolerance `capture.sh` states
        # (2/255 on at most 200 pixels), which is what two rasterisers were measured to need. Skipping
        # goldens in CI is how a consistent change passes CI and fails only on one laptop.

      # A capture that differs from itself is the one failure whose cause is an image, not a log line.
      # Upload the renders so the next person can diff them instead of guessing.
      - name: captures (even when the gate failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: out/*.png
          if-no-files-found: ignore
